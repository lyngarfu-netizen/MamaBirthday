<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songs That Remind Me Of You</title>
    <!-- Google Fonts untuk gaya tulisan tangan -->
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <!-- Pautan ke fail CSS -->
    <link rel="stylesheet" href="GiftBiru.css">
</head>
<body>

    <!-- Container untuk hujan nota muzik -->
    <div class="note-container" id="noteContainer"></div>

    <div class="songs-container">
        <!-- Tajuk Halaman -->
        <div class="header-title">
            <h1>Songs That Remind Me</h1>
            <h2>Of You</h2>
        </div>

        <!-- Bahagian Piring Hitam (Vinyl) dan Gambar Polaroid -->
        <div class="vinyl-section">
            <!-- Piring Hitam -->
            <div class="vinyl-record">
                <div class="vinyl-grooves"></div>
                <!-- Nama lagu di tengah piring hitam -->
                <div class="vinyl-label">
                    <span class="song-title-label">Blue & Grey</span>
                </div>
            </div>

            <!-- Gambar Polaroid Mengelilingi Piring Hitam -->
            <div class="polaroid-item p1">
                <img src="Mama1.jpeg" alt="Memory 1">
            </div>
            <div class="polaroid-item p2">
                <img src="Mama2.jpeg" alt="Memory 2">
            </div>
            <div class="polaroid-item p3">
                <img src="Mama3.jpeg" alt="Memory 3">
            </div>
            <div class="polaroid-item p4">
                <img src="Mama4.jpeg" alt="Memory 4">
            </div>
            <div class="polaroid-item p5">
                <img src="Mama5.jpeg" alt="Memory 5">
            </div>
        </div>

        <!-- Letak fail audio anda di sini -->
        <audio id="bg-music" src="BTS_ Blue & Grey [Instrumental] (Audio).mp3" loop></audio>

        <!-- Ikon Panah Seterusnya di Penjuru Bawah Kanan -->
        <div class="back-arrow">
            <a href="Gift.html">⏮</a>
        </div>
    </div>

    <!-- Skrip Gabungan: Auto-play lagu & Hujan Nota Muzik -->
    <script src="script-GiftBiru.js"></script>

</body>
</html>
