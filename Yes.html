<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Page</title>
    <!-- Google Font gaya tulisan tangan -->
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <!-- Pautan ke fail CSS -->
    <link rel="stylesheet" href="Yes.css">
</head>
<body>

    <div class="birthday-container">
        
        <!-- Bahagian Kiri: Kalendar & Penguin -->
        <div class="left-section">
            <div class="calendar-box">
                <h2 class="month-title">AUGUST</h2>
                <div class="calendar-grid">
                    <!-- Hari -->
                    <span class="day-header sun">S</span>
                    <span class="day-header">M</span>
                    <span class="day-header">T</span>
                    <span class="day-header">W</span>
                    <span class="day-header">Th</span>
                    <span class="day-header">F</span>
                    <span class="day-header">S</span>

                    <!-- Ruang kosong atau tarikh awal -->
                    <span></span><span></span><span></span><span></span><span></span><span></span><span>1</span><span>2</span>
                    <span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>
                    <span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span>
                    <span>17</span><span>18</span><span>19</span><span>20</span><span>21</span><span>22</span><span>23</span>
                    <span>24</span><span>25</span><span>26</span><span>27</span>
                    <!-- Tarikh 28 diletakkan di kolom F (Friday) dan dilingkari -->
                    <span class="circled">28</span>
                    <span>29</span><span>30</span><span>31</span>
                </div>
            </div>

            <!-- Karakter / Haiwan dengan belon -->
            <div class="character-area">
                <img src="Ballon.png" alt="Cute CatBallon" class="catballon-img">
            </div>
        </div>

        <!-- Bahagian Kanan: Teks & Gambar Polaroid -->
        <div class="right-section">
            <div class="birthday-text">
                TODAY MY MOM OFFICIALLY TURNING 54 YEARS!!
            </div>

            <div class="polaroid-group">
                <!-- Polaroid Kiri -->
                <div class="polaroid p1">
                    <img src="Gambar1.jpg" alt="Memory 1">
                </div>
                <!-- Polaroid Kanan -->
                <div class="polaroid p2">
                    <img src="Gambar2.jpg" alt="Memory 2">
                </div>
            </div>
        </div>

        <!-- Butang Panah ke bawah (Seterusnya) -->
        <div class="next-arrow">
            <a href="Gift.html">⏭</a>
        </div>

    </div>

</body>
</html>
